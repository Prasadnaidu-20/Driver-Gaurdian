# DriveGuardian default configuration.
# ALL thresholds, weights, windows, frame-skip values and model paths live here.
# Sections marked "placeholder" are filled in by the phase that implements them.

server:
  host: 127.0.0.1        # bind address for uvicorn
  port: 8000             # HTTP / WebSocket port

stream:
  frame_width: 640       # width (px) frames are resized to in the browser before sending
  frame_height: 480      # height (px) frames are resized to in the browser before sending
  jpeg_quality: 0.7      # browser JPEG encode quality (0-1)
  perf_window_frames: 60 # rolling window (frames) for stream FPS and latency p50/p95

face:                    # Phase 2 — MediaPipe Face Landmarker + geometric features
  enabled: true          # run face analysis in the pipeline
  model_path: models_store/face_landmarker.task   # relative to project root
  model_url: https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task  # used by scripts/download_models.py
  num_faces: 1           # driver only
  min_detection_confidence: 0.5  # MediaPipe face detection confidence
  min_presence_confidence: 0.5   # MediaPipe face presence confidence
  min_tracking_confidence: 0.5   # MediaPipe landmark tracking confidence
  timestamp_reset_ms: 1000  # backward timestamp jump > this recreates the landmarker; smaller non-increase is nudged to last+1 ms
  send_landmarks: true   # include eye/mouth/iris points in FrameResult for the overlay
  crop_size: 224         # crop_face output side (px), used by emotion (Phase 4) and training
  crop_margin: 0.25      # extra margin around the face bbox, fraction of the bbox side

ui:
  chart_window_s: 10     # rolling window (s) of the EAR/MAR chart

calibration:             # Phase 3 — per-driver baseline
  duration_s: 10         # seconds of "look at the road" baseline capture

drowsiness:              # placeholder — Phase 3
  enabled: false

distraction:             # placeholder — Phase 3
  enabled: false

objects:                 # placeholder — Phase 4 (YOLO phone / cup / bottle)
  enabled: false

emotion:                 # placeholder — Phase 4 (context only, never raises risk above Low alone)
  enabled: false

risk:                    # placeholder — Phase 5 (fusion weights, levels, hysteresis)
  enabled: false

alerts:                  # placeholder — Phase 5
  enabled: false

logging:
  level: INFO            # Python logging level: DEBUG | INFO | WARNING | ERROR

mode: rules              # estimator mode: rules | ml | hybrid
